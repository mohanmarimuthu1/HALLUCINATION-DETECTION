# Golden Set A (Phase 7.1) - evidence-provided items for the eval gate.
#
# Three categories, per plan.md:
#   answerable_in_evidence   - evidence directly supports every claim -> GROUNDED
#   unanswerable_in_evidence - evidence present but doesn't address the
#                              claims (or there are too few claims to score
#                              at all) -> NOT_ENOUGH_INFO or NOT_VERIFIABLE
#   injected_contradiction   - evidence contains one deliberately altered
#                              fact that contradicts the answer -> CONTRADICTED
#
# expected_verdict is the ground-truth label eval/metrics.py scores actual
# pipeline output against - not an assertion the pipeline is expected to
# repeat verbatim on every run (that's what the metrics report measures).

- id: golden-a-001
  category: answerable_in_evidence
  question: "What do you know about the Eiffel Tower?"
  answer: >
    The Eiffel Tower is located in Paris, France. It was completed in 1889.
    The tower was designed by engineers working for Gustave Eiffel's
    engineering company. It stands approximately 330 meters tall.
  evidence:
    - "The Eiffel Tower is a wrought-iron lattice tower located in Paris, France, on the Champ de Mars."
    - "Construction of the tower was completed in 1889 as the entrance arch for that year's World's Fair."
    - "The tower was designed by engineers working for Gustave Eiffel's engineering company."
    - "The Eiffel Tower stands approximately 330 meters (1,083 ft) tall, including antennas."
  expected_verdict: GROUNDED
  notes: "Four claims, each directly supported by its own evidence chunk."

