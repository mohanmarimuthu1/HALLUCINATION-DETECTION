# Golden Set B (Phase 7.2) - open-domain items sampled from a public
# benchmark, as a companion to golden set A's hand-authored, evidence-
# provided items.
#
# Source: HaluEval QA subset (https://github.com/RUCAIBox/HaluEval,
# data/qa_data.json), MIT license. 10,000 rows, each with a `knowledge`
# passage, a `question`, a `right_answer`, and a `hallucinated_answer`.
# FEVER and TruthfulQA were considered and rejected (see process.md):
# FEVER's evidence is only referenced by Wikipedia sentence id, not
# inline, and TruthfulQA has no evidence/knowledge field at all - neither
# fits this pipeline's "verify against supplied evidence" design without
# extra machinery HaluEval doesn't need.
#
# Sampling: 30 row indices drawn from the 10,000-row file with
# `random.Random(42).sample(range(10000), 80)`, taking the first 30 whose
# `right_answer` wasn't a bare "yes"/"no" (too short to expand into a
# checkable claim), in the order they were drawn. Each of those 30 rows
# produces exactly two golden items below: one built around the row's
# `right_answer` (expected GROUNDED), one built around its
# `hallucinated_answer` (expected CONTRADICTED or NOT_ENOUGH_INFO). Every
# pair shares the same `source: halueval-qa:<row index>` tag and the same
# evidence (drawn verbatim from that row's `knowledge` field, split into
# its constituent sentences).
#
# Every one of the 60 items below was read and labeled by hand, not
# converted mechanically: several sampled rows were skipped because their
# `hallucinated_answer` turned out, on inspection, to still be true or
# only vaguely non-committal rather than a genuine hallucination (e.g.
# one row's "hallucinated" answer restated a fact the knowledge itself
# confirmed) - shipping those as mislabeled ground truth would have been
# worse than a smaller, correct set. Two extra rows beyond the first 30
# clean ones were pulled from the same 80-row draw to replace skips,
# still in draw order, still from the same fixed-seed sample.
#
# Each answer is composed of 3 claims (this pipeline's fuse.py forces
# NOT_VERIFIABLE below 3 verifiable claims, so a single-fact Q&A pair
# can't otherwise produce a GROUNDED/CONTRADICTED verdict): the tested
# fact (the row's right_answer or hallucinated_answer, reworded into a
# full sentence) plus two other true supporting facts pulled from the
# same knowledge passage, kept identical between the grounded and
# hallucinated variant of a pair - only the tested claim changes.

