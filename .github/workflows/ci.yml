name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest)
        # Fully offline - HTTP is monkeypatched or replaced with FakeProvider
        # throughout, and no API keys are read from the environment: a green
        # run here proves nothing, no secrets, is required.
        run: pytest -v

      - name: Eval gate (golden set A)
        # Also fully offline (Phase 7.4): replays committed responses from
        # tests/data/golden/eval_set_a.replay.json, recorded once against a
        # real free OpenRouter model - no network call, no API key, here.
        # Fails if a golden item's cache key is missing from that file, or
        # if the abstention-recall / quote-verification-rate invariants
        # regress (see eval/__main__.py's module docstring).
        run: python -m halludetect.eval --suite golden
