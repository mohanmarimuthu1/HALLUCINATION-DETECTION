name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # ui is installed so the demo UI's smoke test runs here rather than
        # being skipped for a missing import.
        run: pip install -e ".[dev,ui]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest)
        # Fully offline - HTTP is monkeypatched or replaced with FakeProvider
        # throughout, and no API keys are read from the environment: a green
        # run here proves nothing, no secrets, is required.
        run: pytest -v

      - name: Eval gate (golden set A)
        # Also fully offline (Phase 7.4): replays committed responses from
        # tests/data/golden/eval_set_a.replay.json, recorded once against a
        # real free OpenRouter model - no network call, no API key, here.
        # Fails if a golden item's cache key is missing from that file, or
        # if the abstention-recall / quote-verification-rate invariants
        # regress (see eval/__main__.py's module docstring).
        run: python -m halludetect.eval --suite golden

      - name: Eval gate (golden set B)
        # Phase 7.2 - open-domain items sampled from HaluEval. Same fully
        # offline replay shape as golden set A, from
        # tests/data/golden/eval_set_b.replay.json.
        run: python -m halludetect.eval --suite golden_b
