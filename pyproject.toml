[project]
name = "halludetect"
version = "1.1.0"
description = "Standalone hallucination verification service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "diskcache>=5.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
# Demo UI (Phase 5.4). Kept out of the core install so the API image
# does not carry Streamlit.
ui = ["streamlit>=1.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The web page is read at runtime, so it must ship inside the installed
# package (Docker and Vercel both install it rather than using src/).
"halludetect.web" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = [
    # str(MyEnum.X) and f"{MyEnum.X}" differ between `class X(str, Enum)`
    # and `class X(StrEnum)` (the latter drops the "ClassName." prefix) -
    # confirmed directly, not assumed. Every enum in this codebase already
    # relies on the str/Enum mixin's behavior (structlog log lines, error
    # messages), so this is a real behavior change, not a pure style fix.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() are meant to be called as argument defaults -
# that's the framework's own dependency-injection pattern, not the mutable-
# default-argument bug B008 otherwise correctly catches.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

[tool.vercel]
# Deploys the API. Without this Vercel picks up the repo-root app.py, which
# is the Streamlit UI launcher, and fails the build. Streamlit itself can't
# run on Vercel (it needs a long-lived server holding a websocket).
entrypoint = "src.halludetect.api.main:app"
